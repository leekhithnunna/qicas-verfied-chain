# Test-only config: real_snapshot.yaml shape with SYNTHETIC values (no real Electricity Maps data).
# Workload = tests/fixtures/alibaba_dags_fixture.json, regenerated byte-for-byte from alibaba_batch_task_tiny.csv
# by tests/test_data_loaders.py::make_fixture_workload.
seed: 7
watts_per_core: 12
volume_mb_lognormal: [6.0, 1.0]
workload:
  source: file
  path: tests/fixtures/alibaba_dags_fixture.json
regions:
  - {name: r0, ci_g_per_kwh: 223, price_uusd_per_kwh: 54788, capacity_share: 0.25}
  - {name: r1, ci_g_per_kwh: 223, price_uusd_per_kwh: 21800, capacity_share: 0.40}
  - {name: r2, ci_g_per_kwh: 300, price_uusd_per_kwh: 60000, capacity_share: 0.45}
  - {name: r3, ci_g_per_kwh: 600, price_uusd_per_kwh: 40000, capacity_share: 0.45}
network: {energy_mwh_per_mb: 30, egress_nusd_per_mb: 20000}
weights: {carbon: 1, cost: 1}
market: {rounds: 10, step0: 1.0}
snapshot:
  hour: "2030-01-02T12:00:00Z"
  carbon_basis: direct
  fx: {source: synthetic, date: "2030-01-02", usd_per_eur: "1.0903", inr_per_eur: "91.622"}
  sources:
    r0:
      carbon: {zone: XX-TEST, path: tests/fixtures/em_tiny.csv}
      price:  {kind: entsoe, path: tests/fixtures/entsoe_tiny.csv}
    r1:
      carbon: {zone: XX-TEST, path: tests/fixtures/em_tiny.csv}
      price:  {kind: em_json, path: tests/fixtures/em_price_tiny.json}
